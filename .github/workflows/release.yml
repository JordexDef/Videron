name: Build release downloads

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - id: source
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.source.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test

  macos:
    needs: source
    uses: ./.github/workflows/macos-release.yml
    with:
      source: ${{ needs.source.outputs.tag }}

  linux:
    needs: source
    uses: ./.github/workflows/linux-release.yml
    with:
      source: ${{ needs.source.outputs.tag }}

  windows-and-macos-server:
    needs: source
    uses: ./.github/workflows/portable-release.yml
    with:
      source: ${{ needs.source.outputs.tag }}

  downloads:
    needs: [source, macos, linux, windows-and-macos-server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.source.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloads
          merge-multiple: true
      - name: Verify the download matrix and write checksums
        working-directory: downloads
        run: |
          version=${TAG#v}
          files=(
            "Videron-$version.exe" "Videron-$version-windows-arm64.exe"
            "Videron-$version-macOS.dmg" "Videron-Sync-$version-macOS-universal.tar.gz"
          )
          for arch in amd64 arm64; do
            files+=("Videron-$version-linux-$arch.tar.gz" "Videron-Sync-$version-linux-$arch.tar.gz" "Videron-Sync-$version-windows-$arch.exe")
          done
          for file in "${files[@]}"; do test -s "$file"; done
          test "$(find . -type f | wc -l)" -eq "${#files[@]}"
          sha256sum -- "${files[@]}" | sort -k2 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Attach downloads to the draft for a new tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "This release has already been published."
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "Videron ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" downloads/* --clobber
