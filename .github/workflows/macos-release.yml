name: macOS release build

on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      source:
        description: Full commit SHA or release tag (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SOURCE_REF: ${{ inputs.source }}
    steps:
      - name: Select release source
        id: source
        shell: bash
        run: |
          if [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          elif [[ "$SOURCE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ref=refs/tags/$SOURCE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "Expected a full commit SHA or vX.Y.Z release tag." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.ref }}
      - name: Read release version
        shell: bash
        run: |
          version=$(jq -er '.info.productVersion' wails.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$SOURCE_REF" == v* ]]; then
            test "$SOURCE_REF" = "v$version"
          else
            test "$SOURCE_REF" = "$(git rev-parse HEAD)"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test Go packages
        run: go test ./...
      - name: Build for Apple silicon and Intel
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.17.1 build -platform darwin/universal -s -skipbindings -trimpath
      - name: Check the bundle and launch it in a fresh profile
        shell: bash
        run: |
          app=build/bin/Videron.app
          binary="$app/Contents/MacOS/Videron"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$RELEASE_VERSION"
          lipo "$binary" -verify_arch arm64 x86_64
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p "$RUNNER_TEMP/videron-home"
          HOME="$RUNNER_TEMP/videron-home" "$binary" > "$RUNNER_TEMP/videron-launch.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/videron-launch.log"
            exit 1
          fi
      - name: Create and verify the disk image
        shell: bash
        run: |
          stage="$RUNNER_TEMP/videron-dmg"
          image="build/bin/Videron-${RELEASE_VERSION}-macOS.dmg"
          mkdir "$stage"
          ditto build/bin/Videron.app "$stage/Videron.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Videron -srcfolder "$stage" -format UDZO "$image"
          hdiutil verify "$image"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: videron-macos
          path: build/bin/Videron-*-macOS.dmg
          if-no-files-found: error
          compression-level: 0
