<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18191b">
  <meta name="color-scheme" content="dark">
  <title>Videron</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232b2b2d'/%3E%3Cpath d='M10 18h13l10 18-7 12z' fill='%23bcbcbc'/%3E%3Cpath d='m25 47 16-29h13L33 54z' fill='%23efefeb'/%3E%3C/svg%3E">
  <script src="/landing.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    html { background: #18191b; }
    body { margin: 0; font-family: Inter, "Segoe UI", Arial, sans-serif; color: #eceae4; }
    main {
      display: grid;
      align-content: center;
      justify-items: center;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100svh;
      padding: 18px 0 clamp(24px, 7vh, 80px);
      position: relative;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 44%, #232427 0%, #1b1c1e 50%, #18191b 83%);
    }
    main::before {
      position: absolute;
      content: "";
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle, #bbb6ad48 .75px, transparent 1px) center / 19px 19px;
      mask-image: radial-gradient(ellipse 51% 52% at 50% 45%, #000 16%, transparent 100%);
    }
    .map {
      display: block;
      width: min(100%, 1030px);
      aspect-ratio: 880 / 390;
      user-select: none;
      -webkit-user-select: none;
    }
    .map.interactive { touch-action: none; }
    h1 {
      margin: .02em 0 0;
      font-size: clamp(58px, 7vw, 92px);
      font-weight: 500;
      letter-spacing: -.07em;
      line-height: 1.12;
      padding-right: .07em;
    }
    .folder { --tone: #aea3be; --ink: #e1d8e8; --rim: #88818e; --disc: url(#violet); }
    .sage { --tone: #99aba3; --ink: #cfdfd6; --rim: #73867d; --disc: url(#sage); }
    .sand { --tone: #bfa782; --ink: #e8d8bb; --rim: #978569; --disc: url(#sand); }
    .folder-skin {
      fill: var(--tone);
      fill-opacity: .035;
      stroke: var(--tone);
      stroke-opacity: .36;
      stroke-width: 1;
    }
    .connections { stroke: var(--tone); stroke-width: 1.05; stroke-opacity: .6; fill: none; }
    .bridge { fill: none; stroke: #9c999e; stroke-opacity: .5; stroke-width: 1; stroke-dasharray: 2 4; }
    .note, .folder-skin { touch-action: none; outline: none; -webkit-tap-highlight-color: transparent; }
    .interactive .note, .interactive .folder-skin { cursor: grab; }
    .map.dragging, .map.dragging * { cursor: grabbing; }
    .disc { fill: var(--disc); stroke: var(--rim); stroke-width: 1.35; }
    .glyph {
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .emblem { fill: url(#pearl); stroke: #e1ded6; stroke-width: 1.2; }
    .aura { fill: none; stroke: #d5d0ca; stroke-width: 1; opacity: .16; }
    .detail { pointer-events: none; }
    .interactive .note:is(:hover, :focus-visible, .held) .disc { stroke: var(--ink); }
    .interactive .note:is(:hover, :focus-visible, .held) .emblem { stroke: white; }
    .interactive .note:focus-visible .disc { stroke-width: 3; }
    .interactive .folder-skin:is(:hover, :focus-visible, .held) { fill-opacity: .067; stroke-opacity: .77; }
    .interactive .folder-skin:focus-visible { stroke-width: 2; }
    @media (prefers-reduced-motion: no-preference) {
      .disc, .folder-skin { transition: stroke .14s, stroke-opacity .14s, fill-opacity .14s; }
      .map:not(.explored) .aura { animation: breathe 6s ease-in-out infinite alternate; }
      @keyframes breathe {
        from { transform: scale(.97); opacity: .08; }
        to { transform: scale(1.05); opacity: .32; }
      }
    }
    @media (max-width: 600px) {
      .map { aspect-ratio: 440 / 428; }
      main::before { mask-image: radial-gradient(ellipse 82% 48% at 50% 45%, #000 12%, transparent 100%); }
      h1 { margin-top: .16em; }
    }
    @media (max-height: 490px) and (min-aspect-ratio: 1/1) {
      main { padding: 4px 0 12px; }
      .map { width: min(100%, 170vh); aspect-ratio: 880 / 390; }
      h1 { font-size: clamp(36px, 13vh, 60px); margin-top: 0; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="map" viewBox="0 0 880 390" role="group" aria-label="Карта заметок" aria-describedby="map-help" xmlns="http://www.w3.org/2000/svg">
      <desc id="map-help">Перетаскивайте заметки и группы. С клавиатуры выберите заметку или группу клавишей Tab и перемещайте стрелками.</desc>
      <defs>
        <linearGradient id="sage" x2=".8" y2="1">
          <stop stop-color="#424d47"/><stop offset="1" stop-color="#2b3330"/>
        </linearGradient>
        <linearGradient id="violet" x2=".8" y2="1">
          <stop stop-color="#4a454f"/><stop offset="1" stop-color="#322f36"/>
        </linearGradient>
        <linearGradient id="sand" x2=".8" y2="1">
          <stop stop-color="#50483a"/><stop offset="1" stop-color="#363129"/>
        </linearGradient>
        <linearGradient id="pearl" x1=".15" y1="0" x2=".85" y2="1">
          <stop stop-color="#f3f0e9"/><stop offset=".52" stop-color="#dbd8d1"/><stop offset="1" stop-color="#b4b2af"/>
        </linearGradient>
        <symbol id="quill" viewBox="0 0 24 24"><path d="M3 21l12-12M6 17v-5l8-8a5 5 0 0 1 7 7l-7 7H7m2-5h5"/></symbol>
        <symbol id="spark" viewBox="0 0 24 24"><path d="m12 3 2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3Z"/></symbol>
        <symbol id="page" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM13 3v5h5M9 12h6m-6 4h5"/></symbol>
        <symbol id="list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h8M4 6h.1M4 12h.1M4 18h.1"/></symbol>
        <symbol id="link" viewBox="0 0 24 24"><path d="m10 14 4-4m-6 5-1 1a3.5 3.5 0 0 1-5-5l4-4a3.5 3.5 0 0 1 5 0m2 10a3.5 3.5 0 0 0 5 0l4-4a3.5 3.5 0 0 0-5-5l-1 1" transform="rotate(-6 12 12)"/></symbol>
        <symbol id="stack" viewBox="0 0 24 24"><path d="m2.5 8 9.5-5 9.5 5-9.5 5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
        <symbol id="bookmark" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4Z"/></symbol>
        <symbol id="image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.4"/><path d="m4 18 5-5 3 3 4-5 5 6"/></symbol>
        <symbol id="brand" viewBox="0 0 64 64">
          <path d="M10 18h13l10 18-7 12z" fill="#747479"/>
          <path d="m25 47 16-29h13L33 54z" fill="#343438"/>
          <path d="m25 47 8-11 8-18-15 25z" fill="#939399"/>
        </symbol>
      </defs>

      <g class="detail" aria-hidden="true">
        <path class="bridge" data-between="inspiration draft" d="M268 190 Q342 207 399 173"/>
        <path class="bridge" data-between="reference index" d="M509 159 Q558 202 613 279"/>
      </g>

      <g class="folder sage" transform="translate(230 214)" data-narrow="112 266">
        <circle class="folder-skin" r="88" aria-label="Группа набросков"/>
        <path class="connections detail" data-edges="sketch inspiration sketch fragment inspiration fragment" d="M-22 -12L38 -24M-22 -12L17 40M38 -24L17 40"/>
        <g class="note" id="sketch" transform="translate(-22 -12)" aria-label="Набросок">
          <circle class="disc" r="33"/><use class="glyph detail" href="#quill" x="-14" y="-14" width="28" height="28"/>
        </g>
        <g class="note" id="inspiration" transform="translate(38 -24)" aria-label="Идея">
          <circle class="disc" r="20"/><use class="glyph detail" href="#spark" x="-9" y="-9" width="18" height="18"/>
        </g>
        <g class="note" id="fragment" transform="translate(17 40)" aria-label="Фрагмент">
          <circle class="disc" r="23"/><use class="glyph detail" href="#page" x="-10" y="-10" width="20" height="20"/>
        </g>
      </g>

      <g class="folder" transform="translate(454 128)" data-narrow="256 126">
        <circle class="folder-skin" r="110" aria-label="Главная группа"/>
        <path class="connections detail" data-edges="core draft core idea core reference idea reference" d="M-9 -9L-55 45M-9 -9L44 -52M-9 -9L55 31M44 -52L55 31"/>
        <g class="note" id="core" transform="translate(-9 -9)" aria-label="Videron">
          <circle class="aura detail" r="48"/>
          <circle class="disc emblem" r="43"/><use class="detail" href="#brand" x="-31" y="-32" width="62" height="62"/>
        </g>
        <g class="note" id="draft" transform="translate(-55 45)" aria-label="Черновик">
          <circle class="disc" r="23"/><use class="glyph detail" href="#list" x="-10" y="-10" width="20" height="20"/>
        </g>
        <g class="note" id="idea" transform="translate(44 -52)" aria-label="Мысль">
          <circle class="disc" r="18"/><use class="glyph detail" href="#spark" x="-8" y="-8" width="16" height="16"/>
        </g>
        <g class="note" id="reference" transform="translate(55 31)" aria-label="Связь">
          <circle class="disc" r="25"/><use class="glyph detail" href="#link" x="-11" y="-11" width="22" height="22"/>
        </g>
      </g>

      <g class="folder sand" transform="translate(653 257)" data-narrow="310 327">
        <circle class="folder-skin" r="82" aria-label="Группа материалов"/>
        <path class="connections detail" data-edges="collection index collection picture" d="M15 3L-40 22M15 3L-15 -44"/>
        <g class="note" id="collection" transform="translate(15 3)" aria-label="Коллекция">
          <circle class="disc" r="32"/><use class="glyph detail" href="#stack" x="-14" y="-14" width="28" height="28"/>
        </g>
        <g class="note" id="index" transform="translate(-40 22)" aria-label="Закладка">
          <circle class="disc" r="18"/><use class="glyph detail" href="#bookmark" x="-7.5" y="-7.5" width="15" height="15"/>
        </g>
        <g class="note" id="picture" transform="translate(-15 -44)" aria-label="Изображение">
          <circle class="disc" r="20"/><use class="glyph detail" href="#image" x="-9" y="-9" width="18" height="18"/>
        </g>
      </g>
    </svg>
    <h1>Videron</h1>
  </main>
</body>
</html>
